name: Rust and TypeScript CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build bridge executable for DSH integration test
        run: cargo build --bin dsh-rs-bridge --bin acp-test-agent
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check ACP smoke script syntax
        run: |
          node --check scripts/acp-smoke.mjs
          node --check scripts/bridge-acp-e2e.mjs
      - name: Install TypeScript integration dependencies
        working-directory: typescript
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Type-check DSH adapter
        working-directory: typescript
        run: npm run typecheck
      - name: Run DSH AgentFactory integration test
        working-directory: typescript
        env:
          DSH_RS_BRIDGE_BIN: ${{ github.workspace }}/target/debug/dsh-rs-bridge
          DSH_RS_BRIDGE_ACP_TEST_BIN: ${{ github.workspace }}/target/debug/acp-test-agent
        run: npm test

  real-acp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download OpenCode ACP agent and verify handshake
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          install_dir="$RUNNER_TEMP/opencode"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            https://opencode.ai/files/bin/2.2.0/opencode-linux-x64.tar.gz \
            --output "$archive"
          tar -xzf "$archive" -C "$install_dir"
          binary="$(find "$install_dir" -type f -name opencode -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          DSH_RS_BRIDGE_ACP_SMOKE_COMMAND="$binary" \
            DSH_RS_BRIDGE_ACP_SMOKE_ARGS='["acp"]' \
            DSH_RS_BRIDGE_ACP_SMOKE_TIMEOUT_MS=45000 \
            node scripts/acp-smoke.mjs
